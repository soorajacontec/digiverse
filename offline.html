<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digiverse · Offline</title>
<meta name="theme-color" content="#07080f">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  :root { --void:#07080f; --ink:#ebe8f3; --muted:#9296b2; --sol:#f2b441; color-scheme:dark }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 40%, #11152b, var(--void) 70%); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:24px; box-sizing:border-box; text-align:center }
  main { max-width:420px; display:grid; gap:14px; justify-items:center }
  h1 { margin:0; font-size:26px }
  p { margin:0; color:var(--muted) }
  button { margin-top:8px; border:0; border-radius:12px; padding:12px 20px; background:var(--sol); color:#1a1204; font:600 15px system-ui,sans-serif; cursor:pointer }
</style>
</head>
<body>
<main>
  <img src="icons/icon.svg" width="72" height="72" alt="">
  <h1>You're offline</h1>
  <p>Digiverse couldn't load because there's no connection and the app hasn't been saved on this device yet. Connect once, and it will work offline from then on.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
